name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: publish-github-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-release-candidate:
    if: >-
      github.repository == 'xz-dev/pi' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact generated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted GitHub context and clean input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'xz-dev/pi'
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "::error::Refusing event $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep tmux
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build packages
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: ./test.sh

      - name: Prepare immutable GitHub Release candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-github-release.mjs --out "$RUNNER_TEMP/pi-github-release"
          node scripts/verify-github-release.mjs node "$RUNNER_TEMP/pi-github-release/release-manifest.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          status=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$status" ]]; then
            echo "::error::Release preparation or verification modified the exact source checkout"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload exact Release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pi-github-release/*.tgz
            ${{ runner.temp }}/pi-github-release/release-manifest.json
            ${{ runner.temp }}/pi-github-release/install.ts
            ${{ runner.temp }}/pi-github-release/install.sh
            ${{ runner.temp }}/pi-github-release/install.ps1
            ${{ runner.temp }}/pi-github-release/SHA256SUMS
            ${{ runner.temp }}/pi-github-release/attestation-subjects.txt
            ${{ runner.temp }}/pi-github-release/version
            ${{ runner.temp }}/pi-github-release/tag
          if-no-files-found: error
          retention-days: 14

  accept-release-candidate:
    needs: build-release-candidate
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout exact verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download exact Release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/pi-github-release

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm and Bun global installs
        run: node scripts/verify-github-release.mjs all "${{ runner.temp }}/pi-github-release/release-manifest.json"

  publish-release:
    needs:
      - build-release-candidate
      - accept-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download exact Release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/pi-github-release

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact candidate and publication context
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/pi-github-release"
          test "$GITHUB_REPOSITORY" = 'xz-dev/pi'
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "::error::Refusing event $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(<"$candidate/tag")" = "xz-v$(<"$candidate/version")"
          test "$(node -e 'const fs=require("node:fs");const p=process.argv[1];const m=JSON.parse(fs.readFileSync(p,"utf8"));process.stdout.write(m.commit)' "$candidate/release-manifest.json")" = "$GITHUB_SHA"
          while IFS= read -r subject; do
            test "$subject" = "$(basename "$subject")"
            test -f "$candidate/$subject"
          done < "$candidate/attestation-subjects.txt"
          node scripts/verify-github-release.mjs node "$candidate/release-manifest.json"

      - name: Attest exact Release subjects
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/pi-github-release/*.tgz
            ${{ runner.temp }}/pi-github-release/release-manifest.json
            ${{ runner.temp }}/pi-github-release/install.ts
            ${{ runner.temp }}/pi-github-release/install.sh
            ${{ runner.temp }}/pi-github-release/install.ps1
            ${{ runner.temp }}/pi-github-release/SHA256SUMS

      - name: Stage and verify public attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/pi-github-release"
          subjects="$candidate/attestation-subjects.txt"
          bundle="$RUNNER_TEMP/public-attestation-bundle.jsonl"
          test -s "$BUNDLE_PATH"
          mapfile -t subject_names < "$subjects"
          test "${#subject_names[@]}" -eq 6
          for subject in "${subject_names[@]}"; do
            test "$subject" = "$(basename "$subject")"
          done
          cp "$BUNDLE_PATH" "$bundle"
          for subject in "${subject_names[@]}"; do
            gh attestation verify "$candidate/$subject" \
              --bundle "$bundle" \
              --repo xz-dev/pi \
              --signer-workflow xz-dev/pi/.github/workflows/publish-github-release.yml \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          empty_gh_config="$RUNNER_TEMP/empty-gh-config"
          mkdir "$empty_gh_config"
          GH_CONFIG_DIR="$empty_gh_config" GH_TOKEN= GITHUB_TOKEN= gh attestation verify "$candidate/${subject_names[0]}" \
            --bundle "$bundle" \
            --repo xz-dev/pi \
            --signer-workflow xz-dev/pi/.github/workflows/publish-github-release.yml \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/public-attestation-verification.json"
          test -s "$RUNNER_TEMP/public-attestation-verification.json"
          cp "$bundle" "$subjects"

      - name: Publish immutable GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-github-release.mjs "${{ runner.temp }}/pi-github-release/release-manifest.json"
