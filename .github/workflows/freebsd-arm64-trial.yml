name: FreeBSD arm64 trial

# Non-publishing trial of the emulated FreeBSD arm64 acceptance path. Delete
# once freebsd-arm64 is part of publish-github-release.yml.
on:
  push:
    branches: [trial/freebsd-arm64]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build-freebsd-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Build and accept FreeBSD arm64 (QEMU TCG)
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: "14.3"
          arch: aarch64
          mem: 8192
          prepare: pkg install -y node22 npm-node22 bash curl git-lite zip unzip libxcb xorg-vfbserver fd-find ripgrep
          run: git config --global --add safe.directory "$PWD" && time bash scripts/freebsd-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: "freebsd-arm64-trial-${{ github.sha }}", path: ".artifacts/freebsd-release/", if-no-files-found: warn, retention-days: 7 }
