name: Esc Abort Integration

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  esc-abort-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model data
        run: npm run generate:models

      - name: Build pi-ai
        run: npm run build:offline --workspace=@earendil-works/pi-ai

      - name: Run esc abort focused regressions
        run: |
          npm test --workspace=@earendil-works/pi-agent-core -- test/agent.test.ts
          npm test --workspace=@earendil-works/pi-coding-agent -- test/agent-session-concurrent.test.ts test/suite/regressions/6234-esc-abort-stuck-extension-tmux.test.ts
