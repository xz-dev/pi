      - name: Build the pi-env daemon
        shell: bash /tmp/diag42-run.sh daemon {0}
        run: npm run build:daemon --workspace packages/env
      - name: Run full test suite
        shell: bash /tmp/diag42-run.sh full-suite {0}
        run: ./test.sh
      - name: Record sanitized full-sequence receipt
        if: always()
        run: |
          node --input-type=module <<'SUMMARY'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";

          // Sanitized receipt only: identities, exits, counts, hashes, names. No raw logs, environment values or heap data.
          const out = `${process.env.RUNNER_TEMP}/diag42`;
          const read = (name) => {
          	try {
          		return JSON.parse(fs.readFileSync(`${out}/${name}`, "utf8"));
          	} catch {
          		return null;
          	}
          };
          const expected = read("expected-bodies.json") ?? [];
          const phases = expected.map(({ phase, originalStep, bodySha256 }) => {
          	const attempt = read(`phase-${phase}.attempt.json`);
          	const result = read(`phase-${phase}.json`);
          	return {
          		phase,
          		originalStep,
          		executed: attempt !== null,
          		originalBodySha256: bodySha256,
          		runtimeScriptSha256: attempt?.scriptSha256 ?? null,
          		runtimeScriptMatchesOriginalBody: attempt ? attempt.scriptSha256 === bodySha256 : null,
          		attempt,
          		result,
          	};
          });
          let npm = null;
          try {
          	npm = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          } catch {}
          const receipt = {
          	workflow: "AI retention full-sequence diagnostic",
          	event: process.env.GITHUB_EVENT_NAME,
          	ref: process.env.GITHUB_REF,
          	sha: process.env.GITHUB_SHA,
          	runId: process.env.GITHUB_RUN_ID,
          	runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          	runtime: {
          		node: process.version,
          		v8: process.versions.v8,
          		npm,
          		availableParallelism: os.availableParallelism(),
          		totalMemoryBytes: os.totalmem(),
          		nodeOptionsPresent: process.env.NODE_OPTIONS !== undefined,
          	},
          	host: read("host.json"),
          	tools: read("tools.json"),
          	phases,
          	historicalFailureNotCleared: true,
          	productFixClaimed: false,
          };
          const json = JSON.stringify(receipt, null, 2);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\`\`\`json\n${json}\n\`\`\`\n`);
          console.log("[diag42-receipt-begin]");
          console.log(json);
          console.log("[diag42-receipt-end]");
          SUMMARY
