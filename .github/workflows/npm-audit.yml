# Diagnostic only (leader seq11): the Windows clippy fix for the env-tail44 delivery on top of main f7dfcb53 (tree
# 6351cb96), run in the Environments tests jobs that failed (windows-latest, windows-11-arm) plus ubuntu-24.04-arm, and CI
# test (other). Original commands and assertions; the Windows OpenSSH service steps are not run. No publish, push, secrets
# or write permissions.
name: diag env-tail44-win

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-env-tail44-win
  cancel-in-progress: false

jobs:
  env-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diagnostic boundary
        id: guard
        run: bash .github/diag-tail44-guard.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Original installs openssh-server when missing; the diagnostic only checks (no system writes).
      - name: Check the SSH server for the bootstrap tests
        if: runner.os == 'Linux'
        run: |
          command -v sshd || test -x /usr/sbin/sshd || { echo "sshd absent, original install step not executed"; exit 1; }

      - name: Daemon format, lint and unit tests
        working-directory: packages/env/daemon
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the daemon
        working-directory: packages/env
        run: npm run build:daemon

      - name: Durable env tests
        working-directory: packages/durable
        run: npx vitest --run test/env-node.test.ts test/env-node-spill.test.ts test/env-node-conformance.test.ts test/env-line-scan.test.ts test/tools.test.ts test/tools-read-differential.test.ts

      - name: pi-env tests
        working-directory: packages/env
        run: npx vitest --run --reporter=verbose --disableConsoleIntercept

      # Byte counts and timing only: the original large-output program behind a client that is slow after 7 MiB.
      - name: Slow client probe
        if: always() && steps.guard.outcome == 'success'
        working-directory: packages/env
        run: |
          cp ../../.github/diag-tail44-probe.ts test/tail44-probe.ts
          node test/tail44-probe.ts 0 3 0
          node test/tail44-probe.ts 120 3 7340032

  test-other:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diagnostic boundary
        run: bash .github/diag-tail44-guard.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Replaces the original sudo apt-get install of fd-find and ripgrep (leader seq38): runner tools or pinned archives.
      - name: Tools without system packages
        run: bash .github/diag-tail44-tools.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          PI_TEST_WORKSPACE_GROUP: other
        run: ./test.sh
