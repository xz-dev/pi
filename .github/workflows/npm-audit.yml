# Disposable diagnostic ref only: the original Upstream Sync build/check/test sequence, retained step bodies
# byte-identical, without rebuild, push, release, Nix or secret references. Generated by generate-diag42-full-sequence.mjs.

name: AI retention full-sequence diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-retention42-full-sequence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify bounded diagnostic source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/diag/ai-retention42-full-sequence ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD^)" == 1cc235c2d5689b0951288828971056e93bd1970b ]]
          [[ "$(git rev-parse 'HEAD^^{tree}')" == 68e6fdd5367e5eb8fa389e06795690079c4b02d3 ]]
          [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == .github/workflows/npm-audit.yml ]]
          git diff --exit-code HEAD
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          out="$RUNNER_TEMP/diag42"
          mkdir -m 700 "$out"
          printf '{"cpus":%s,"memTotalKiB":%s,"kernel":"%s"}\n' "$(nproc)" "$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)" "$(uname -r)" > "$out/host.json"
      - name: Install diagnostic phase recorder
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/diag42"
          (umask 077; set -o noclobber; cat > "/tmp/diag42-run.sh" <<'DIAG42_RUN'
          #!/usr/bin/env bash
          # Runs one unchanged original step body in the runner environment, as the original Sync did, and records it.
          # Usage: run.sh PHASE SCRIPT
          set -uo pipefail
          phase="$1" script="$2"
          out="$RUNNER_TEMP/diag42"
          [[ "$phase" =~ ^[a-z0-9-]+$ && -f "$script" ]] || { echo "::error::diag42 bad phase"; exit 2; }
          # Fail closed if a credential-bearing variable reached this step; only names are ever recorded.
          denied="$(compgen -e | grep -E '^(GITHUB_TOKEN|GH_TOKEN|ACTIONS_ID_TOKEN_REQUEST_(TOKEN|URL)|ANTHROPIC_(AUTH|OAUTH)_TOKEN|ANTHROPIC_IDENTITY_TOKEN_FILE|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_BEARER_TOKEN_BEDROCK|AWS_WEB_IDENTITY_TOKEN_FILE|AWS_CONTAINER_CREDENTIALS_(FULL|RELATIVE)_URI|COPILOT_GITHUB_TOKEN|GOOGLE_APPLICATION_CREDENTIALS|HF_TOKEN|[A-Z0-9_]*_API_KEY)$' | paste -sd, -)"
          sensitive_names="$(compgen -e | grep -Ei 'token|secret|key|pass|cred' | sort | paste -sd, -)"
          started="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          # One attempt per phase: the marker exists before the body runs and is never overwritten.
          ( set -o noclobber; printf '{"phase":"%s","startedAt":"%s","scriptSha256":"%s","deniedEnvNames":"%s","sensitiveLookingEnvNames":"%s"}\n' \
            "$phase" "$started" "$(sha256sum "$script" | cut -d' ' -f1)" "$denied" "$sensitive_names" > "$out/phase-$phase.attempt.json" ) \
            || { echo "::error::diag42 phase $phase already attempted"; exit 1; }
          [[ -z "$denied" ]] || { echo "::error::diag42 credential-bearing variable names present: $denied"; exit 1; }
          log="$out/phase-$phase.log"
          ( umask 077; : > "$log" )
          node "$out/sampler.mjs" "$$" "$out/phase-$phase.processes.json" &
          sampler=$!
          # Original steps set no shell, so GitHub ran them as `bash -e {0}` (no pipefail); keep exactly that.
          bash -e "$script" 2>&1 | tee -a "$log"
          status=${PIPESTATUS[0]}
          kill -TERM "$sampler" 2>/dev/null
          wait "$sampler" 2>/dev/null
          ended="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          node "$out/snapshot.mjs" "$phase" "$status" "$started" "$ended" "$log" "$out" \
            || echo "::warning::diag42 snapshot failed for $phase"
          rm -f "$log"
          exit "$status"
          DIAG42_RUN
          )
          chmod 0700 "/tmp/diag42-run.sh"
          (umask 077; set -o noclobber; cat > "$out/sampler.mjs" <<'DIAG42_SAMPLER'
          // Samples only descendants of one phase wrapper; records counts and whitelisted Node flag names, never argv values or environment.
          import fs from "node:fs";

          const [rootText, file] = process.argv.slice(2);
          const root = Number(rootText);
          const allowed = new Set([
          	"--expose-gc", "--max-old-space-size", "--max-semi-space-size", "--stack-size", "--conditions", "-C",
          	"--enable-source-maps", "--no-warnings", "--experimental-strip-types", "--experimental-transform-types",
          	"--experimental-vm-modules", "--import", "--require", "-r", "--loader", "--experimental-loader", "--inspect",
          	"--inspect-brk", "--cpu-prof", "--heap-prof", "--trace-gc", "--single-threaded", "--jitless", "--test",
          	"--test-concurrency", "--test-reporter",
          ]);
          const state = {
          	sampleIntervalMs: 1000,
          	samples: 0,
          	maxNodeProcesses: 0,
          	maxVitestForkWorkers: 0,
          	vitestWorkerEntries: [],
          	nodeFlagNames: [],
          	limit: "1s /proc sampling of wrapper descendants; short-lived processes and worker threads can be missed; flag values omitted",
          };
          const flags = new Set();
          const entries = new Set();

          function scan() {
          	const parent = new Map();
          	for (const name of fs.readdirSync("/proc")) {
          		if (!/^\d+$/.test(name)) continue;
          		try {
          			const stat = fs.readFileSync(`/proc/${name}/stat`, "utf8");
          			parent.set(Number(name), Number(stat.slice(stat.lastIndexOf(")") + 2).split(" ")[1]));
          		} catch {}
          	}
          	let nodes = 0;
          	let workers = 0;
          	for (const pid of parent.keys()) {
          		if (pid === process.pid) continue;
          		let ancestor = parent.get(pid);
          		for (let depth = 0; ancestor && ancestor !== root && depth < 64; depth++) ancestor = parent.get(ancestor);
          		if (ancestor !== root) continue;
          		let argv;
          		try {
          			argv = fs.readFileSync(`/proc/${pid}/cmdline`, "utf8").split("\0").filter(Boolean);
          		} catch {
          			continue;
          		}
          		if (!argv.length || !/(^|\/)node$/.test(argv[0])) continue;
          		nodes++;
          		for (const arg of argv.slice(1)) {
          			if (!arg.startsWith("-")) break;
          			const name = arg.split("=")[0];
          			if (allowed.has(name)) flags.add(name);
          		}
          		const entry = argv.find((arg) => arg.includes("/vitest/dist/workers/"));
          		if (entry) {
          			entries.add(entry.slice(entry.indexOf("vitest/dist/workers/")));
          			if (entry.endsWith("/forks.js") || entry.endsWith("/vmForks.js")) workers++;
          		}
          	}
          	state.samples++;
          	state.maxNodeProcesses = Math.max(state.maxNodeProcesses, nodes);
          	state.maxVitestForkWorkers = Math.max(state.maxVitestForkWorkers, workers);
          }

          const timer = setInterval(scan, state.sampleIntervalMs);
          scan();
          process.on("SIGTERM", () => {
          	clearInterval(timer);
          	state.nodeFlagNames = [...flags].sort();
          	state.vitestWorkerEntries = [...entries].sort();
          	fs.writeFileSync(file, JSON.stringify(state), { mode: 0o600 });
          	process.exit(0);
          });
          DIAG42_SAMPLER
          )
          chmod 0600 "$out/sampler.mjs"
          (umask 077; set -o noclobber; cat > "$out/snapshot.mjs" <<'DIAG42_SNAPSHOT'
          // After one phase: exit, working-tree/generated/compiled/data fingerprints and sanitized suite counts. No raw output leaves.
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import { stripVTControlCharacters } from "node:util";

          const [phase, statusText, startedAt, endedAt, log, out] = process.argv.slice(2);
          const sha = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const git = (...args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 }).trim();
          const walk = (dir, result = []) => {
          	let entries;
          	try {
          		entries = fs.readdirSync(dir, { withFileTypes: true });
          	} catch {
          		return result;
          	}
          	for (const entry of entries) {
          		const path = `${dir}/${entry.name}`;
          		if (entry.isDirectory()) walk(path, result);
          		else if (entry.isFile()) result.push(path);
          	}
          	return result;
          };
          const aggregate = (paths) => {
          	const hash = createHash("sha256");
          	for (const path of paths.sort()) hash.update(`${path}\0${sha(fs.readFileSync(path))}\n`);
          	return { files: paths.length, sha256: hash.digest("hex") };
          };
          const fileSha = (path) => (fs.existsSync(path) ? sha(fs.readFileSync(path)) : null);
          const status = git("status", "--porcelain=v1", "--untracked-files=all");
          const text = fs.existsSync(log) ? stripVTControlCharacters(fs.readFileSync(log, "utf8")) : "";
          const lines = text.split("\n");
          const counts = (label) =>
          	lines
          		.filter((line) => new RegExp(`^\\s*${label}\\s+\\d`).test(line))
          		.map((line) =>
          			Object.fromEntries(
          				[...line.matchAll(/(\d+) (failed|passed|skipped|todo)/g)].map((match) => [match[2], Number(match[1])]),
          			),
          		);
          const failures = lines.filter((line) => /^\s*FAIL\s+\S/.test(line));
          const processes = (() => {
          	try {
          		return JSON.parse(fs.readFileSync(`${out}/phase-${phase}.processes.json`, "utf8"));
          	} catch {
          		return null;
          	}
          })();
          const receipt = {
          	phase,
          	exit: Number(statusText),
          	startedAt,
          	endedAt,
          	git: {
          		head: git("rev-parse", "HEAD"),
          		headTree: git("rev-parse", "HEAD^{tree}"),
          		statusEntries: status ? status.split("\n").length : 0,
          		statusSha256: sha(status),
          	},
          	modelsGeneratedSha256: fileSha("packages/ai/src/models.generated.ts"),
          	providerData: aggregate(walk("packages/ai/src/providers/data")),
          	compiled: aggregate(fs.readdirSync("packages").flatMap((name) => walk(`packages/${name}/dist`))),
          	native: {
          		processOwner: fileSha("packages/coding-agent/dist/native/process-owner/pi-env"),
          		envDaemonDebug: fileSha("packages/env/daemon/target/debug/pi-env"),
          	},
          	vitestTestFiles: counts("Test Files"),
          	vitestTests: counts("Tests"),
          	failureHeaders: failures.slice(0, 40).map((line) =>
          		line
          			.trim()
          			.replace(/https?:\/\/\S+/g, "[URL]")
          			.replace(/[\x00-\x1f\x7f-\x9f]/g, "")
          			.slice(0, 500),
          	),
          	failureHeaderCount: failures.length,
          	failureHeadersTruncated: failures.length > 40,
          	processes,
          };
          fs.writeFileSync(`${out}/phase-${phase}.json`, JSON.stringify(receipt), { mode: 0o600 });
          DIAG42_SNAPSHOT
          )
          chmod 0600 "$out/snapshot.mjs"
          (umask 077; set -o noclobber; cat > "$out/expected-bodies.json" <<'DIAG42_EXPECTED'
          [{"phase":"npm-ci","originalStep":"Install dependencies for pre-push gates","bodySha256":"e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21","originalStepBodySha256":"e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21"},{"phase":"hydrate","originalStep":"Hydrate model data for pre-push gates","bodySha256":"dc847daf4e26ed436eadfc5f6c28c8cc8a6eaf8553b88ac3b7c0b35acccb8bb9","originalStepBodySha256":"dc847daf4e26ed436eadfc5f6c28c8cc8a6eaf8553b88ac3b7c0b35acccb8bb9"},{"phase":"build","originalStep":"Build rebuilt main","bodySha256":"16c0e4305ac213dff39fc82b69b6e08aeeb8758e33cd72d7c409752a70e9f054","originalStepBodySha256":"16c0e4305ac213dff39fc82b69b6e08aeeb8758e33cd72d7c409752a70e9f054"},{"phase":"check","originalStep":"Check rebuilt main","bodySha256":"ce3c2fd1d74ae43153de389ebd5007c31d2924343b269e7f5ef2a884313981ff","originalStepBodySha256":"bb39cd6d364fc5a42af5b330b4dc1baa491b35a53217ae5bf67bb4930c76a2db"},{"phase":"update-safety","originalStep":"Test update retries and safety","bodySha256":"d8f7fccf3fc12525fb0d45da016d00f14e5808dab060da0437e68c4b5aaea016","originalStepBodySha256":"d8f7fccf3fc12525fb0d45da016d00f14e5808dab060da0437e68c4b5aaea016"},{"phase":"focused","originalStep":"Run focused integration tests","bodySha256":"233248afb340b676f6aaf9d42abc8952240daed4fa863b283d197a309007f0e9","originalStepBodySha256":"233248afb340b676f6aaf9d42abc8952240daed4fa863b283d197a309007f0e9"},{"phase":"daemon","originalStep":"Build the pi-env daemon","bodySha256":"745f6f6aaba9d7b125c74987bace25409ebc3c1b2bf173f2545758fee41b1dd2","originalStepBodySha256":"745f6f6aaba9d7b125c74987bace25409ebc3c1b2bf173f2545758fee41b1dd2"},{"phase":"full-suite","originalStep":"Run full test suite","bodySha256":"63b57d2b54d57aaeba38171edb9e4fa8d3c72462745a8605ffce18013c0c734d","originalStepBodySha256":"63b57d2b54d57aaeba38171edb9e4fa8d3c72462745a8605ffce18013c0c734d"}]
          DIAG42_EXPECTED
          )
          chmod 0600 "$out/expected-bodies.json"
      - name: Configure original Sync Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Select supported Node for pre-push gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
      - name: Install dependencies for pre-push gates
        shell: bash /tmp/diag42-run.sh npm-ci {0}
        run: npm ci --ignore-scripts
      - name: Assert diagnostic workflow boundary
        run: |
          node --input-type=module <<'BOUNDARY'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import YAML from "yaml";

          // Fail closed before any build or test: manual-only, read-only token, no persisted credentials, no secret references.
          const doc = YAML.parse(fs.readFileSync(".github/workflows/npm-audit.yml", "utf8"));
          assert.deepEqual(Object.keys(doc.on), ["workflow_dispatch"]);
          assert.deepEqual(doc.permissions, { contents: "read" });
          assert.deepEqual(Object.keys(doc.jobs), ["full-sequence"]);
          const job = doc.jobs["full-sequence"];
          for (const key of ["permissions", "secrets", "environment", "services", "container", "strategy"]) assert.equal(job[key], undefined, key);
          const checkouts = job.steps.filter((step) => step.uses?.startsWith("actions/checkout@"));
          assert.equal(checkouts.length, 1);
          assert.equal(checkouts[0].with["persist-credentials"], false);
          assert.ok(job.steps.every((step) => step["continue-on-error"] === undefined));
          const self = "Assert diagnostic workflow boundary";
          const strings = [];
          const walk = (value) => {
          	if (typeof value === "string") strings.push(value);
          	else if (value && typeof value === "object") for (const item of Object.values(value)) walk(item);
          };
          walk({ ...doc, jobs: { "full-sequence": { ...job, steps: job.steps.filter((step) => step.name !== self) } } });
          assert.ok(!strings.some((text) => /\bsecrets\s*[.[]/.test(text)), "workflow must not reference secrets");
          assert.ok(!strings.some((text) => /id-token|contents:\s*write/.test(text)), "workflow must not request write or OIDC tokens");
          console.log("diag42 workflow boundary: manual-only, contents:read, persist-credentials:false, no secret references");
          BOUNDARY
      - name: Hydrate model data for pre-push gates
        shell: bash /tmp/diag42-run.sh hydrate {0}
        run: npm run hydrate:model-data
      - name: Build rebuilt main
        shell: bash /tmp/diag42-run.sh build {0}
        run: npm run build
      - name: Check rebuilt main
        shell: bash /tmp/diag42-run.sh check {0}
        run: |
          # biome check --write may apply formatting fixes to merged files
          # (union resolutions can produce non-canonical layout). Apply them
          # first as a formatting commit; npm run check then verifies the
          # tree stays clean.
          npx biome check --write --error-on-warnings . >/dev/null 2>&1 || true
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: apply post-merge formatting"
          fi
          # npm run check is the gate, with one documented exception: the
          # model-catalog drift class (AGENTS.md "Known Pre-existing
          # Failures"). The helper runs the check and filters exactly that
          # class; any other failure (any non-tsc stage, or any TS error
          # outside the class) still fails the sync.
          bash scripts/check-allow-model-catalog-drift.sh
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '::error::Check mutated rebuilt main\n%s\n' "$status"
            git diff --stat
            git diff --name-status
            exit 1
          fi
      - name: Setup Zig for native fixture tests
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
      - name: Prepare test tools without system installation
        run: |
          set -euo pipefail
          # Replaces the original privileged package-install step: no system packages, no /usr writes. Prefer runner tools; otherwise one
          # pinned upstream musl binary per tool, verified before extraction, written only to a job-private directory.
          out="$RUNNER_TEMP/diag42"
          bin="$out/bin"
          mkdir -p "$bin" "$out/archives"
          fetch_pinned() {
            local name="$1" url="$2" size="$3" archive_sha="$4" member="$5" binary_sha="$6"
            local archive="$out/archives/${url##*/}"
            curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 -o "$archive" "$url"
            [[ "$(stat -c %s "$archive")" == "$size" ]]
            echo "$archive_sha  $archive" | sha256sum --check --strict --quiet -
            [[ "$(tar -tzf "$archive" | grep -cxF "$member")" == 1 ]]
            [[ "$(tar -tvzf "$archive" "$member" | cut -c1)" == - ]]
            tar -xOzf "$archive" "$member" > "$bin/$name.tmp"
            echo "$binary_sha  $bin/$name.tmp" | sha256sum --check --strict --quiet -
            chmod 0755 "$bin/$name.tmp"
            mv "$bin/$name.tmp" "$bin/$name"
          }
          if command -v fd >/dev/null; then
            fd_source=runner-fd
          elif command -v fdfind >/dev/null; then
            # Private equivalent of the original /usr/local/bin/fd symlink.
            ln -s "$(command -v fdfind)" "$bin/fd"
            fd_source=runner-fdfind-private-alias
          else
            fetch_pinned fd https://github.com/sharkdp/fd/releases/download/v10.3.0/fd-v10.3.0-x86_64-unknown-linux-musl.tar.gz \
              1759301 2b6bfaae8c48f12050813c2ffe1884c61ea26e750d803df9c9114550a314cd14 \
              fd-v10.3.0-x86_64-unknown-linux-musl/fd 9f48273b6c780a5f4f084ef30bc67d98cbd7d10c55c4605cf3a6ee29b741af87
            fd_source=pinned-archive
          fi
          if command -v rg >/dev/null; then
            rg_source=runner
          else
            fetch_pinned rg https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz \
              2263077 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599 \
              ripgrep-15.1.0-x86_64-unknown-linux-musl/rg ebeaf56f8a25e102e9419933423738b3a2a613a444fd749d695e15eba53f71f2
            rg_source=pinned-archive
          fi
          echo "$bin" >> "$GITHUB_PATH"
          fd_path="$(PATH="$bin:$PATH" command -v fd)"
          rg_path="$(PATH="$bin:$PATH" command -v rg)"
          fd_version="$("$fd_path" --version | head -n1)"
          rg_version="$("$rg_path" --version | head -n1)"
          graphics="$(dpkg-query -W -f='${Package}=${Version} ' libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev 2>/dev/null || true)"
          node --input-type=module - "$out/tools.json" "$fd_source" "$fd_version" "$(sha256sum "$(readlink -f "$fd_path")" | cut -d' ' -f1)" \
            "$rg_source" "$rg_version" "$(sha256sum "$(readlink -f "$rg_path")" | cut -d' ' -f1)" "$graphics" <<'TOOLS'
          import fs from 'node:fs';
          const [file, fdSource, fdVersion, fdSha256, rgSource, rgVersion, rgSha256, graphics] = process.argv.slice(2);
          fs.writeFileSync(file, JSON.stringify({
            fd: { source: fdSource, version: fdVersion, sha256: fdSha256 },
            rg: { source: rgSource, version: rgVersion, sha256: rgSha256 },
            originalAptGraphicsDevPackagesPresent: graphics.trim().split(/\s+/).filter(Boolean),
            originalPackageInstallStep: 'not executed: privileged global install incompatible (leader seq38)',
          }), { mode: 0o600 });
          TOOLS
      - name: Test update retries and safety
        shell: bash /tmp/diag42-run.sh update-safety {0}
        run: |
          cd packages/coding-agent
          node ../../node_modules/vitest/dist/cli.js --run \
            test/git-update.test.ts \
            test/package-manager.test.ts \
            test/package-manager-git-shallow.test.ts \
            test/bun-npm-update.test.ts \
            test/package-command-paths.test.ts \
            test/list-models-refresh.test.ts \
            test/management-http.test.ts \
            test/version-check.test.ts \
            test/xz-release-update.test.ts
      - name: Run focused integration tests
        shell: bash /tmp/diag42-run.sh focused {0}
        run: |
          (
            cd packages/chord
            node ../../node_modules/vitest/dist/cli.js --run test/old/websocket.test.ts
          )
          (
            cd packages/coding-agent
            node ../../node_modules/vitest/dist/cli.js --run \
              test/assistant-message.test.ts \
              test/suite/regressions/thinking-preview-display.test.ts
          )
          npx vitest run \
            packages/coding-agent/test/extensions-discovery.test.ts \
            --testNamePattern 'loads the coding-agent entrypoint without rewriting pi-ai provider subpaths' \
            --testTimeout 15000
          (
            cd packages/ai
            node ../../node_modules/vitest/dist/cli.js --run \
              test/event-stream.test.ts \
              test/openai-responses-compat.test.ts \
              test/openai-responses-websocket.test.ts \
              test/openai-responses-websocket-loopback.test.ts \
              test/response-checkpoints.test.ts \
              test/openai-responses-checkpoints-websocket.test.ts \
              test/provider-transport-status.test.ts \
              test/openai-codex-websocket-lazy.test.ts \
              test/openai-codex-websocket-recovery.test.ts \
              test/openai-codex-stream.test.ts \
              test/request-compression.test.ts \
              test/request-compression-loopback.test.ts \
              test/websocket-compression.test.ts \
