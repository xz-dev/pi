name: Windows byte-I/O interoperability probe (stage 1)
# Stage1 only: local full43 replay/check passed before enabling this probe.
# The scratch push trigger avoids publishing product branches just to register a workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - ci-probe/windows-interop-20261111
    paths:
      - .github/workflows/probe-windows-interop.yml
      - scripts/windows-interop-probe/**
permissions:
  contents: read
jobs:
  byte-io:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
        mechanism: [crt, named]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Verify source hashes, compile fixture, run only the selected runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-interop-probe'
          $out = Join-Path $env:RUNNER_TEMP 'windows-interop-${{ matrix.runtime }}-${{ matrix.mechanism }}'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$src/*" -Destination $out
          Copy-Item "$env:GITHUB_WORKSPACE/.github/workflows/probe-windows-interop.yml" "$out/workflow.yml"
          Get-FileHash -Algorithm SHA256 "$out/workflow.yml" | Format-List | Out-File "$out/workflow-hash.txt"
          foreach ($line in Get-Content "$src/SHA256SUMS") {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw 'Malformed source manifest' }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $src $parts[1])).Hash.ToLowerInvariant()
            if ($actual -cne $parts[0]) { throw "Source hash mismatch: $($parts[1])" }
          }
          # Use only the runner's already installed Rust/MSVC setup. Missing setup stops here.
          $targets = rustup target list --installed
          if ($LASTEXITCODE -ne 0 -or 'x86_64-pc-windows-msvc' -notin $targets) { throw 'Required installed Rust target missing' }
          $targets | Set-Content "$out/installed-targets.txt"
          @("source_commit=$env:GITHUB_SHA", "runner_arch=$env:RUNNER_ARCH", "node=$(node --version)", "bun=$(bun --version)", "rustc=$(rustc --version)") | Set-Content "$out/versions.txt"
          node --check "$src/driver.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$src/driver.test.mjs" > "$out/parser.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --edition=2024 --target=x86_64-pc-windows-msvc "$src/fixture.rs" -o "$out/fixture.exe" 2>&1 | Tee-Object "$out/compile.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 "$out/fixture.exe" | Format-List | Out-File "$out/fixture-hash.txt"
          & '${{ matrix.runtime }}' "$src/driver.mjs" "$out/fixture.exe" '${{ matrix.mechanism }}' 1> "$out/result.json" 2> "$out/driver-stderr.log"
          $probeExit = $LASTEXITCODE
          "driver_exit=$probeExit" | Set-Content "$out/driver-exit.txt"
          # Unsupported or guarded cases are not green. Never try another CLI as rescue.
          exit $probeExit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-interop-stage1-x64-${{ matrix.runtime }}-${{ matrix.mechanism }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-interop-${{ matrix.runtime }}-${{ matrix.mechanism }}
          if-no-files-found: warn
          retention-days: 14
